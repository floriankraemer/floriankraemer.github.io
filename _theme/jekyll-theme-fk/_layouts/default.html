<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script src="{{ "/assets/theme/js/tabs.js" | relative_url }}"></script>
    <script>
      jekyllTabs.init({
        addCopyToClipboardButtons: true,
        copyToClipboardSettings: {
          buttonHTML: '<button class="jekyll-tabs-copy-button" type="button">Copy</button>',
          showToastMessageOnCopy: true
        }
      });
    </script>
    <script type="module" src="{{ "/assets/theme/js/mermaid-setup.js" | relative_url }}"></script>

  </body>

</html>
