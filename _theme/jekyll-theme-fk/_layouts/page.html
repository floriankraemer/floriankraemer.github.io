---
layout: default
---
<article class="post page">

  <header class="page-header">
    <div class="fk-bar" aria-hidden="true"></div>
    {%- if page.label %}
    <div class="fk-label">{{ page.label | escape }}</div>
    {%- endif %}
    <h1 class="page-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
