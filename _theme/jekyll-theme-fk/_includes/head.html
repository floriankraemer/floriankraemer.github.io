<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- if page.layout == "post" -%}
    {%- include post-meta.html -%}
  {%- endif -%}
  <link rel="preload" href="{{ "/assets/theme/fonts/Barlow_400Regular.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/assets/theme/fonts/BarlowCondensed_700Bold.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "/assets/theme/css/main.css" | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/theme/images/mark.svg" | relative_url }}">
  <link rel="icon" type="image/png" href="{{ "/assets/theme/images/avatar.png" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/assets/theme/images/avatar.png" | relative_url }}">
  <meta name="theme-color" content="#1C314D">
  {%- feed_meta -%}
  <link type="application/rss+xml" rel="alternate" href="{{ '/rss.xml' | absolute_url }}" title="{{ site.title | xml_escape }}">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
